body:
  text: 葬書術數類三相宅相墓之屬提要臣等謹案葬書一卷舊本題晉郭璞撰璞有爾雅注已著録葬地之說莫知其所自來周官冡人墓大夫之職稱皆以族葬是三代以上葬不擇地之明證漢書藝文志形法家以宮宅地形與相人相物之書並列則其數自漢始明然尚未專言葬法也後漢書袁安傳載安父沒訪求葬地道逢三書生指一處當世為上公安從之故纍世貴盛是其術盛傳於東漢以後其特以是擅名者則璞為最著考璞本傳載璞從河東郭公受青囊中書九卷遂洞天文五行卜筮之術璞門人趙載嘗竊青囊書為火所焚不言其嘗著葬書唐末有葬書地脈經一卷葬書五隂一卷又不言為璞所作惟宋志載有璞葬書一卷是其書自宋始出其後方技之家競相粉飾遂有二十篇之多蔡元定病其蕪雜為刪去十二篇存其八篇吳澄又病蔡氏未盡藴奧擇至純者為內篇精粗純駁相半者為外篇粗駁當去而姑存者為雜篇新喻劉則章親受之吳氏為之注釋今此本所分內篇外篇雜篇蓋猶吳氏之舊本至注之出於劉氏與否則不可考矣宋志本名葬書後來術家尊其說者改名葬經毛晉汲古閣刻本亦承其訛殊為失考今仍題舊名以從其朔焉乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:dd089b84fd1e7e4bb9365de5474eb26350c31bd1181bbb12ffd562649658d74a
