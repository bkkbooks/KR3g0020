body:
  text: 葬書晉郭璞撰内篇葬者乘生氣也生氣即一元運行之氣在天則周流六虚在地則發生萬物天無此則氣無以資地無此則形無以載故磅礴乎大化貫通乎品彚無處無之而無時不運也陶侃曰先天地而長存後天地而固有蓋亦指此云耳且夫生氣藏于地中人不可見惟循地之理以求之然後能知其所在葬者能知其所在使枯骨得以乗之則地理之能事畢矣五氣行乎地中發而生乎萬物五氣即五行之氣迺生氣之别名也夫一氣分而為隂陽析而為五行雖運于天實出于地行則萬物發生聚則山川融結融結者即二五之精妙合而凝也人受體於父母本骸得氣遺體受廕父母骸骨為子孫之本子孫形體迺父母之枝一氣相廕由本而逹枝也故程子曰卜其宅兆卜其地之美惡也地美則神靈安子孫盛若培壅其根而枝葉茂理固然也惡則反是蔡季通曰生死殊途情氣相感自然黙與之通今尋暴骨以生人刺血滴之而滲入則為親骨肉不滲則非氣類相感有如此者則知枯骨得廕生人受福其理顯然不待智者而後知也或謂抱養既成元非遺體僧道嗣續亦異所生其何能廕之有而不知人之心通乎氣心為氣之主情通則氣亦通義絶則廕亦絶故後母能廕前母子前母亦發後母兒其在物則蔞藪螟蛉之類是也尚何疑焉經曰氣感而應鬼福及人父母子孫本同一氣互相感召如受鬼福故天下名墓在在有之葢眞龍發迹迢迢百里或數十里結為一穴及至穴前則峯巒矗擁衆水環遶叠嶂層層獻竒于後龍脉抱衛砂水翕聚形穴既就則山川之靈秀造化之精英凝結融㑹于其中矣茍盜其精英竊其靈秀以父母遺骨藏于融㑹之地由是子孫之心寄托于此因其心之所寄遂能與之感通以致福于將來也是知人心通乎氣而氣通乎天以人心之靈合山川之靈故降神孕秀以鍾于生息之源而其富貴貧賤壽夭賢愚靡不攸係至于形貌之妍醜並皆肖象山川之美惡故嵩嶽生申尼丘孕孔豈偶然哉嗚呼非葬骨也乃葬人之心也非山川之靈亦人心自靈耳世有徃徃以遺骨弃諸水火而無祻福者葢心與之離故也是以銅山西崩靈鐘東應漢未央宮一日無故鐘自鳴東方朔曰必主銅山崩應未幾西蜀果奏銅山崩以日揆之正未央鐘鳴之日也帝問朔何以知之對曰銅出于山氣相感應猶人受體于父母也帝嘆曰物尚爾况于人乎昔曽子養母至孝子出母欲其歸則齧指而曽子心痛人凡父母不安而身離侍側則亦心痛特常人孝心薄而不自覺耳故知山崩鐘應亦其理也木華於春栗芽於室此亦言一氣之感召也野人藏栗春至栗木華而家藏之栗亦芽實之去本已乆彼華此芽葢以本性原在得氣則相感而應亦猶父母之骨葬乘生氣而子孫福旺也夫一氣磅礴於天地間無端倪無終窮萬物隨時運化本不自知而受造物者亦不自知也蓋生者氣之聚凝結者成骨死而獨留故葬者反氣入骨以廕所生之法也乾父之精坤母之血二氣感合則精化為骨血化為肉復藉神氣資乎其間遂生而為人及其死也神氣飛揚血肉消潰惟骨獨存而上智之士圖葬於吉地之中以肉乘生氣外假子孫思慕一念與之脗合則可以復其既徃之神萃其已㪚之氣蓋神趨則氣應地靈而人傑以無為有借偽顯眞事通隂陽功奪造化是為反氣入骨以廕所生之法也丘壠之骨岡阜之支氣之所隨丘壠為隂岡阜為陽丘言其高骨乃山之𢃄石者壠高不能自立必藉石𢃄土而後能聳也岡者跡也土山為阜言支之有毛脊者壠之有骨氣隨而行則易見支無石故必觀其毛脊而後能辨也然有壠而土支而石壠而隱支而隆者又全藉乎心目之巧以區别也經曰氣乗風則㪚界水則止謂生氣隨支壠體質流行滔淊而去非水界則莫之能止及其止也必得城郭完宻前後左右環圍然後能藏風而不致有蕩㪚之患經云明堂惜水如惜血堂裏避風如避賊可不慎哉古人聚之使不散行之使有止故謂之風水高壠之地天隂自上而降生氣浮露最怕風寒易為蕩散如人深居宻室稍有罅隙通風適當肩背便能成疾故當求其城郭宻固使氣之有聚也平支之穴地陽自下而升生氣沉濳不畏風吹缺出在曠野雖八面無蔽已自不覺或遇穴晴日朗其温和之氣自若故不以寛曠為嫌但取横水之有止使氣之不行也此言支壠之取用不同有如此風水之法得水為上藏風次之支壠二者俱欲得水高壠之地或從腰落雖無大江攔截亦必池塘以止内氣不則去水稍遠而隨身金魚不可無也儻金魚不界則謂之雌雄失經雖藏風亦不可用平支之地雖若無蔽但得横水攔截何嫌寛曠故二者皆以得水為上也經曰外氣横形内氣止生蓋言此也水流土外謂之外氣氣藏土中謂之内氣故必得外氣形横則内之生氣自然止也此引經以結上文得水為上之意何以言之氣之盛雖流行而其餘者猶有止雖零散而其深者猶有聚高壠之地落勢雄雌或去或止各有缺作自缺一地可盡其力量也而好龍多從腰落分布枝蔓於數十里之間或為城郭朝樂官曜禽鬼捍門華表羅星之類皆本身自帶不可為彼既流行而餘者非止也但當求其聚處而使之不散耳平支之龍大山跌落平洋四畔曠闊其為城郭亦不過高逾數尺而已且去穴遼逺朝山一㸃在乎雲靄之表人莫不以八風無蔽為嫌又豈知支壠氣隱若零散而其深者猶有聚也但得横水攔截使之有止耳此言支壠之氣盛者如此故藏於涸燥者宜深藏於坦夷者宜淺上句言壠下句言支高壠之地隂之象也氣在内强剛而沉下故言涸燥當深葬平支之地陽之象也氣在外弱柔而浮上故言坦夷當淺葬經曰淺深得乗風水自成高壠之葬潛而弗彰故深取其沉氣也平支之葬露而弗隱故淺取其浮氣也得乗者言所葬之棺得以乗其生氣也淺深世俗多用九星白法以定尺寸謬也不若只依金銀爐底求之為得夫隂陽之氣噫而為風升而為雲降而為雨行乎地中而為生氣隂陽之氣即地中之生氣故噫為風升為雲降為雨凡所以位天地育萬物者何莫非此氣邪斯蓋因曰葬乗生氣故重舉以申明其義愚嘗謂能生能殺皆此氣也葬得其法則為生氣失其道則為殺氣如所謂加減饒借吞吐浮沉之類並當依法而剪裁之不致有撞殺沖刑破腮翻鬬之患也夫土者氣之體有土斯有氣氣者水之母有氣斯有水氣本無體假土為體因土而知有此氣也水本無母假氣為母因氣而知有此水也五行以天一生水且水何從生哉生水者金也生金者土也土腹藏金無質而有其氣乾藏坤内隱而未見及乎生水其兆始萌言氣為水母者即乾金之氣也世人不究本源但以所見者水爾故遂以水為天地之始蓋通而未精者也經曰土形氣形物因以生生氣附形而有依土而行萬物亦莫非缺也此引經結上文有土斯有氣之意夫氣行乎地中其行也因地之勢其聚也因勢之止氣行地中人不可見其始也則因地之勢而知其行其次也又因勢之止而知其聚也葬者原其起乗其止善葬者必原其起以觀勢乗其止以扦穴凡言止者乃山川融結竒秀之所有非明眼莫能識也片玉髓云草上露華偏在尾花中香味總居心其止之謂與或謂粘穴乗其脉之盡處為止然則葢倚撞安可以止云不知古人正恐後世不識止處故立為四法以乗之夫葢者止于葢倚者止于倚也撞粘莫不皆然唯觀義之所在高低正側何徃而非止乎地勢原脉山勢原骨委蛇東西或為南北平夷多土阧潟多石支之行必認土脊以為脉壠之行則求石脊以為骨其行度之勢委蛇曲折千變萬化本無定式大畧與丘壠之骨岡阜之支略同千尺為勢百尺為形千尺言其逺指一枝山之來勢也百尺言其近指一穴地之成形也勢來形止是謂全氣全氣之地當葬其止原其逺勢之來察其近形之止形勢既順則山水翕合是為全氣之地又當求其止處而葬之斯盡善矣止之一字最謂喫緊世之葬者不乏全氣之地但于止處則有昧焉耳夫千里來龍五尺入手纔差一指盡廢前功縱竒峯聳拔秀水之𤣥皆不為我用矣若得其𫝊知其止則如數二三辨黒白人或見其莽然可左可右可移可易而不知中間自有一定不易之法尺寸不可遷改者指南云立穴若還裁不正縱饒吉地也徒然高低深淺如葬誤福變為災起􅍔愆宛委自復回環重復宛委自復指其勢而言或順或逆即委蛇東西或為南北之意也回環重復以其形而論層拱疊繞即朝海拱辰之義也全氣之地其融結之情如此若踞而候也如人之踞然不動而有所待然若攬而有也如貴人端坐器具畢陳攬之而有餘欲進而却欲止而深上句言擁衛之山須得趨揖朝拱不欲其僭逼衝突而不遜也下句言瀦蓄之水必得止聚淵澄不欲其阧㵼反背而無情也來積止聚沖陽和隂來山凝結其氣積而不散止水融㑹其情聚而不流斯乃隂陽交濟山水沖和也土高水深鬱草茂林水深沉則土壤高厚氣沖和則草木茂昌程子曰曷謂地之美土色光潤草木茂盛迺其騐也貴若千乗富如萬金氣像尊嚴若千乗之貴擁簇繁夥猶萬金之富經曰形止氣蓄化生萬物為上地也堂局完宻形穴止聚則生氣藏蓄于中矣善葬者因其聚而乗之則可以福見在昌後裔如萬物由此氣而成化育之功故為上地地貴平夷土貴有支支龍貴平坦夷曠為得支之正體而土中復有支之紋理平緩恬軟不急不燥則表裏相應然却有支體而得壠之情性者直如擲搶急如綳線謂之倒火硬木此陽中含隂也法當避殺粘唇架折而葬劉氏所謂直急則避毬而凑簷是也陽者為弱本宜凑入奈何性急要縮下一二尺緩其急性茍執支法扦之則凶此支龍之至難體認者故景純謂支龍之辨蓋言此也支之所起氣隨而始支之所終氣隨以鍾此言平支行度體段原其始則氣勢隨之而行乗其止則氣脉因之而鍾觀勢察脉則可以知其氣之融結矣觀支之法隱隱隆隆微妙𤣥通吉在其中隱隱有中之無也隆隆無中之有也其體段若盞中之酥雲中之鴈灰中線路草裏蛇蹤生氣行乎其間㣲妙隱伏而難見然其吉則無以加矣經曰地有吉氣土隨而起支有止氣水隨而比勢順形動回復始終法葬其中永吉無凶引經以明上文支龍行度言平夷之地微露毛脊圓者如浮漚如星如珠方者如箱如印長者如玉尺如蘆鞭曲者如几如帶方圓大小不等者如龜魚蛙蛤是皆地之吉氣湧起故土亦隨之而凸起及其止也則如雞窠旋螺之狀言形止脉盡而一水交度也高水一寸便可言山低土一寸便可言水此支氣之止與水朋比而相為體用者也勢順形動者龍勢順伏而不反逆局形活動而多盤旋砂水鈎夾回環重復首尾無蔽始終有情依法自可扦穴山者勢險而有也法葬其所㑹山言壠也勢雖險峻而其中復有不險之穴但當求其止聚融㑹處而葬之則善矣葢高壠之地來勢高大落勢雄壯結勢亦且缺急此缺之缺也却有一等以隴為體而得支之情性者大山翔舞垂下及至平地變為支體謂之下山水此隂中含陽也若不識粘葬山麓莫不以前拖平地為裀褥豈知其勢未住兩邉界水隨脉而行平平隱伏直至堂心其脉始盡天寳經曰凡認脉情看住絶水若行時脉不歇歇時須有小明堂氣止水交方是穴後面要金氣可乗前頭要合水可洩若還鑿腦而鑿胸湊急傷龍匪融結此定穴之宻語也故當求其砂水㑹處枕毬而葬隂者為强固當縮下奈何性緩要揷上七八寸急其緩性名為湊交鬭煞劉氏所謂擺緩則入簷而湊毬是也茍執壠法扦之則主敗絶此又高隴之至難體認者乗其所來言生氣之所從來因其來而知其止故葬者得以乗之不使有分寸之違也脉不離棺棺不離脉棺脉相就剝花接木法當就化生腦上循脉看下詳認雞跡蠏眼三文名字交牙滴斷或分十字或不分十字看他隂陽配與不配及夫强弱順逆急緩生死浮沉虚實以定加減饒借内接生氣外揚穢氣内外符合前後無蔽始為眞穴一有不順即花假矣此乗生氣之要訣也下言乗金穴土義同審其所廢謂入首廢壊眞偽莫辨故不得不詳加審察也夫天眞末䘮則定穴易為力但乗其來即知其止却有一等不幸為牛羊踐踏上破下崩歲久年深或種作開墾或前人謬扞其旁園墻拜壇不無晦蝕或曽為居基益低損高或田家取土鋤掘戕賊而大八字與金魚不可得而移易但要龍眞局正水淨砂明當取前後左右四應證之心目相度酌量開井無不得矣葢夫一氣化生支壠隨炁而成形質今既廢壊莫辨故必於廢中審之則凡所謂隂陽剛柔急緩生死浮沉虚實之理無不瞭然既得其理則倒杖之法亦因之而定焉擇其所相謂審擇其所相輔于我者法當于小八字下看兩肩暗翊肩高肩低以分隂陽作用次視三分三合﨑急平緩以别順逆饒減盡觀蟬翊之砂蝦鬚之水以定葬口界限是皆左右之所相茍失其道則有破腮翻鬭傷龍傷穴傷淺傷深之患故不得不詳加審擇也下篇言相水印木義同避其所害謂避去死氣以求生氣也葢穴中之氣有刑有徳裁剪得法則為生氣一失其道則為死氣故不得不審而避之何以言之避死挨生是也如陽脉落穴以隂為生陽為死隂脉落穴以陽為生隂為死脉來邉厚邊薄以薄為生厚為死雙脉一長一短以短為生長為死一大一小以小為生大為死以秀嫩光淨圓厚湧動為生枯老臃腫破碎直硬為死又或砂水之間反􅙚斜飛直撞刺射皆為形煞横過之山如鎗如刀尖利順水可收拾為用者用之可避去者避之此則以眼前之所見者而論之也又程子謂五患劉氏謂四惡皆在所當避也是以君子奪神功改天命上文所謂乗審擇避全憑眼力之巧工力之具趨全避缺増高益下微妙在智觸類而長𤣥通隂陽功奪造化及夫穴塲一應作用裁剪放送之法皆是也陳希夷先生曰聖人執其樞機秘其妙用運于己心行之于世天命可移神功可奪厯數可變也道不虚行存乎人耳禍福不旋日經曰葬山之法若呼吸中言應速也禍福之感召㨗于影響能乗能審能擇能避隨其所感否則為凶應矣大要在分别隂陽以為先務有純隂純陽邊隂邊陽上陽下隂上隂下陽隂交陽半陽交隂半强陽弱隂老陽嫩隂各有作法隂來則陽受陽來則隂作或入簷而鬭毬或避毬而湊簷又有陽噓隂吸之不同順中取逆逆中取順情有葢粘則正毬順作情在倚撞則架折逆受假若隂脉落穴放棺饒過陽邊借陽氣一嘘其氣方生陽脉落穴放棺饒過隂邊借隂氣一吸其氣方成所謂陽一嘘而萬物生隂一吸而萬物成是也茍不識裁剪放送之法當嘘而吸當吸而嘘宜順而逆宜逆而順及夫左右吞吐深淺不知其訣不能避殺挨生則生變為殺炁縱使高下無差左右適宜淺深合度猶且不免于禍况未當于理者乎古歌曰若還差一指如隔萬重山良有以也山之不可葬者五氣以生和而童山不可葬也土色光潤草木茂盛為地之美今童山觕頑土脉枯槁無發生沖和之氣故不可葬却又有一等石山文理温潤光如卵殻草木不可立根自然不産開井而得五色土穴者是又不可以童而棄之也氣因形來而斷山不可葬也夫土者氣之體有土斯有氣山既鑿斷則生氣隔絶不相接續故不可葬青華秘髓云一息不來身是殻亦是此意然與自然跌斷者則又不相侔矣氣因土行而石山不可葬也高壠之地何莫非石所謂山勢原骨骨即石也石山行度有何不可惟融結之處不宜有石耳夫石之當忌者焦䃪而頑麻燥而蘓或不受鋤掘火焰飛揚肅煞之氣含烟帶黒為凶也其餘縱使有石但使體質脆嫩文理温潤顔色鮮明則無不吉矣又有竒形怪穴隠于石間者四畔皆石于其中有土穴取去土盡始可容棺又有頑石鑿開而下有土穴皆可入選是未可以石為嫌也氣以勢止而過山不可葬也此言横龍滔滔竟去挽之不住兩邊略有垂下不過橈棹而已氣因勢而止穴因形而結過山無情其勢未止其形未住故不可葬却又有一等横龍滴落正龍腰落及夫斬闗為穴者不同也氣以龍㑹而獨山不可葬也支龍行度兄弟同完雌雄並出及其止也城郭完宻衆山翕集方成吉穴彼單山獨龍孤露無情故不可葬却又有一等支龍不生手足一起一伏金水行度跌露平洋兩邊借外衛送為養䕃及其止也雌雄交度大江拱朝或横攔外陽逺接在乎縹緲之間縱有隂砂僅高一歩此又不可以孤露而棄之也何以言之葢得水為上藏風次之所以為貴也經曰童斷石過獨生新凶而消己福此復證五凶之不可用也凡此是無所缺適足以腐骨爛棺而已主退敗少亾癆疾久則歸于歇滅可不慎哉上地之山若伏若連其原自天此言上地龍之行度體段也大頓小伏藕斷絲連謂之脱卸夫大地千百里行龍其何可窮乎故逺若自天而來也若水之波此言隱伏于平洋大坂之間一望𣺌無涯際層層級級若江面之水微風蕩漾則有輕波細紋謂之行地水微妙𤣥通吉在其中矣若馬之馳原其起若馬之奔騰將欲止如馬之及廐其來若奔其來也奔馳迅速如使者之告㨗其止若尸其止也若尸居不動無復有去意若懐萬寳而燕息衆山朝揖萬水翕聚如貴人燕安休息珍缺富如萬金若攬而有也若具萬善而潔齊明堂寛綽池湖繚繞左右前後眼界不空若貴人坐定珍饌畢陳食前方丈也若槖之鼓槖乃無底囊今煆者引風之具即其類也纔經鼓動其氣即盛言納氣之滿也若器之貯如器之盛物滿而不溢言氣之止聚也若龍若鸞或騰或盤若龍之盤旋鸞之飛騰言其活動有蜿蜒翔舞之體段無破碎死蠢之形狀禽伏獸蹲若萬乗之尊也來勢如虎出深林自幽而漸顯氣象蹲踞而雄壯止勢如鴈落平砂自高而漸低情意俯伏而馴順氣象尊嚴擁䕶綿宻若萬乗之尊也天光發新眼界軒豁氣象爽麗神怡性悦一部精神悉皆收攝而納諸壙中然而至理微妙末易窺測要令目擊道存心領意㑹非文字之可𫝊口舌之可語也中庸曰人莫不飲食鮮能知味也朝海拱辰如萬水之朝宗衆星之拱極枝葉之䕶花朶廊廡之副㕔堂非有使之然者乃一氣感召有如是之翕合也易云水流濕火就燥雲從龍風從虎聖人作而萬物覩其斯之謂歟龍虎抱衛主客相迎凡眞龍落處左廻右抱前朝後擁所以成其形局也未有吉穴而無吉案若龍虎抱衛而主客不相應則為花假無疑四勢朝明五害不親四勢即龍虎主客也貴乎趨揖朝拱端嚴而不敧側明淨而不糢糊情勢如此烏有不吉更欲不親五害五害者童斷石獨過也十一不具是謂其次此特指上地而言十中有一缺泥以為説則世間無全地矣非槩論也海眼曰篇中形勢二字義已了然可見勢在龍而形在局非俗人之所謂喝形也奈何卑鄙之説易惑人心須至錮蔽以訛傳訛以盲誘盲無益反害莫此為甚總之道理原屬廣大精微古聖先賢原為格物致知窮理盡性大學問今人只作籠利想故不得不以術行耳匪直今人之術不及古人今人之用心先不及古人之存心矣奈何外篇夫重岡疉阜羣壠衆支當擇其特聖人之于民類麒麟之于走獸鳯凰之于飛鳥亦類也重岡並出羣阜攅頭須擇其毛骨竒秀神氣俊雅之異于衆者為正也大則特小小則特大衆山俱小取其大衆山俱大取其小叅形雜勢主客同情所不葬也叅形雜勢言眞偽之不分主客同情言汝我之莫辨夫支欲伏于地中壠欲峙于地上伏者隱伏峙者隆峙此言支壠行度體段之不同支壠之止平夷如掌支壠葬法雖有不同然其止處悉皆如掌之平倒杖口訣曰斷續續斷氣受于坦起伏伏起氣受于平李淳風曰來不來坦中裁住不住平中取亦曰來來來堆堆堆慢中取坦中裁皆如掌之義也故支葬其巓壠葬其麓支葬其巓緩而急之也壠葬其麓急而緩之也金牛云緩處何妨安絶頂急時不怕葬深泥卜支如首卜壠如足所謂如首如足亦即巓麓之義謂欲求其如首如足也形氣不經氣脱如逐支壠之葬隨其形勢莫不各有常度不經則不合常度或葬壠于巓首葬支于麓足則生氣脱㪚如馳逐也夫人之葬葢亦難矣支壠之辨眩目惑心禍福之差矦虜有間支壠固亦易辨奈有似支之壠似壠之支支來而壠止壠來而支止或壠變為支而復為壠支變為壠而復為支或以支為壇垜而行壠于上以壠為壇垜而行支于上復有壠内而支外支内而壠外者又有强支弱壠急支緩壠敧支平壠隆支隱壠石支土壠老支嫩壠偏支正壠全支半壠以及夫非支非壠之不可辨者然其中有竒有正有經有權自非明師耳提面命則眩目惑心莫能别也倘支壠互用首足倒施其禍立至今之葬者支壠不能别可無誤乎乗金相水穴土印木此言穴中證應之𤣥微也金亦生氣之異名言即其尖圓之所止也相水者言金魚界合相輔于左右也穴土者土即中央之義謂穴于至中取沖和之氣即葬口是也印木即兩邊蟬翊之砂夾主蝦鬚之水以界穴也神寳經曰三合三分見穴土乗金之義兩片兩翊察相水印木之情葢亦神明其義耳又有所謂水底眼剪刀交水裏坐水裏臥明暗股明暗毬長短翊長短水蝸窟蛤尖交金界玉雞胸鳩尾壽帶孩衿筻口鳥跡生龜死鼈眠乾就濕割脚淋頭明陽暗隂陽落隂出羅紋土宿十字天心撲面水底浮大口出小口水過山不過橋流水不流兩片牛角砂一滴蟹眼水舌尖堪下莫傷唇齒罅可扦休近骨虚簷雨過聲猶滴古鼎􅃄消氣尚浮其名類不一莫可殫舉其言櫽括自非明師耳提面命逐一指示卒難通曉外藏八風内秘五行四維四正完宻而無空缺既無風路則五行之生氣自然秘于其内而凝結矣天光下臨地徳上載天有一星地有一穴在天成象在地成形葬得其所則天星垂光而下照地徳柔順而上載也隂陽沖和五上四備物無隂陽違天背原孤陽不生獨隂不成二五感化乃能沖和沖和之處則必有五色異土以應之言四僃者不取于黒又曰沖和之處隂氣寒至此而温陽氣熱至此而凉温凉之氣是為沖和目力之巧工力之具趨全避闕増高益下微妙在智觸類而長𤣥通隂陽功奪造化目力之巧則能趨全避闕工力之具則能増高益下大凡作用之法隨宜料理千變萬化本無定方全在人之心目靈巧以類度類觸而長之則𤣥功可以盗天地之機通隂陽之理奪造化之權勢如萬馬自天而下星嵐揷漢跕天而下若萬馬奔馳而來也形如負扆有壠中峙法葬其止萬物負隂而抱陽故凡背後不可無屏障以蔽之如人之肩背最畏賊風則易于成疾坐穴亦然眞龍穿障受幙結成形局𤣥武中峙依倚屏障以固背氣此立穴之大槩也然又當求其止聚處而葬之則無不吉矣經曰勢止形昻前澗後岡龍首之藏勢欲止聚形欲軒昻前有攔截之水後有樂托之山形局既就則眞龍藏蓄于此矣鼻顙吉昌角目滅亡耳致矦王唇死兵傷此以龍首為喻而取穴非謂眞有鼻顙角目也但鼻顙以喻中正故吉角目偏斜而又觕硬孤露不受穴故凶耳言深曲唇言淺薄所以有矦王兵傷之别宛而中蓄謂之龍腹其臍深曲必後世福傷其胸脅朝穴暮哭宛宛之中若有所蓄者龍之腹也况又深曲如臍豈有不吉若葬非其道傷其胸者必遇石而帶黒暈傷脇則乾操如聚粟或上緊下虚鋤之如刲肉朝穴暮哭者言其應之速也可不慎哉夫外氣所以聚内氣過水所以止來龍外氣者横過之水内氣者來龍之氣此即外氣横形内氣止生之謂也千尺之勢宛委頓息外無以聚内氣散于地中經曰不蓄之穴腐骨之藏也千尺言來勢之逺也宛委者宛轉委曲而馴順頓息者頓挫止息而融結也若隂陽不交界合不明後無横水以攔截則土中之生氣㪚漫而無收拾矣葬之適足以腐骨夫噫氣能散生氣龍虎所以衛區穴叠叠中阜左空右缺前曠後折生氣㪚于飄風經曰騰陋之穴敗槨之藏也天地之氣噫則為風最能飄散生氣故必藉前後左右衛䕶區穴而後能融結也若堂局雖有入首叠叠之阜却緣左空右缺前曠後凹地之融結悉為風所蕩散則生氣不能蓄聚壠之浮氣升騰于上支之沉氣陋洩于下矣葬之無益于存亡適足以腐敗棺槨而已夫土欲細而堅潤而不澤裁肪切玉備具五色石山土穴欲得似石非石之土細膩豐腴堅實潤滋文理如裁肪也土山石穴必得似土非土之石脆嫩鮮明光澤晶瑩體質如切玉也五氣行乎地中金氣凝則白木氣凝則青火赤土黄皆吉唯水黒則㐫五行以黄為土色故亦以純色為吉又紅黄相兼鮮明者尤美間白亦佳青則不宜多見以近于黒色也枝壠千變萬化高低深淺結作各異唯穴中生氣聚結孕育竒秀而為五色者則無有不吉也言五色者特舉其大綱耳土山石穴亦有如金如玊者或如象牙龍腦珊瑚琥珀瑪瑙車渠朱砂紫粉花細石膏水晶雲母禹餘糧石中黄紫石英之類及石中有鎻子文㯽榔文或㸃㸃雜出而具五色者皆脆嫩温潤似石而非石也石山土穴亦有所謂龍肝鳯髓猩血蟹膏散玉滴金絲紉縷翠柳金黄秋茶褐之類及有異文層沓如花様者或異色鮮明如錦繡者皆堅實光潤似土而非土也即為得生氣矣否則非眞穴也至若活物神異固嘗聞之然有亦能漏泄龍氣大非吉地之宜有高明者宜以鑒之夫乾如聚粟土無氣脉上緊下虚焦白之土麻黒之砂括燥鬆散鋤之如聚粟也濕如刲肉淤濕軟爛鋤之如刲腐肉不任刀也水泉砂礫地氣虚浮腠理不密如濾篾如灰囊内藏氣濕之水外滲天雨之水也皆為㐫宅已上皆㐫葬之則存亡無益適足以腐骨敗槨缺而已夫葬以左為青龍右為白虎前為朱雀後為𤣥武此言前後左右之四獸皆自立穴處言之𤣥武垂頭垂頭言自主峯漸漸而下如欲受人之葬也受穴之處澆水不流置坐可安始合垂頭格也若注水即傾立足不住即為阧瀉之地精華髓云人眠山上龍方住水注堂心穴自安亦其義也朱雀翔舞前山聳㧞端特活動秀麗朝揖而有情也青龍蜿蜒左山活軟寛淨展掌而情意婉順也若反􅙚崛强突兀僵硬則非所謂蜿蜒矣白虎馴頫馴善也如人家蓄犬馴擾而不致有噬主之患也頫者低頭俯伏之義言柔順而無蹲踞之㐫也明堂經云龍蟠臥而不驚是為吉形虎怒蹲視昻頭不平􅍔機中藏又曰白虎彎彎光淨土山䚠如臥角圓如合環虎具此形乃得其眞半低半昻頭高尾藏有缺有陷折腰斷梁虎有此形㐫禍災殃形勢反此法當破死四獸各有本然之體段反此則不吉矣故虎蹲謂之銜屍右山勢蹲昻頭視穴如欲銜噬塚中之屍也龍踞謂之嫉主左山形踞不肻降伏回頭斜視如有嫉妬之情世俗多言龍昻虎伏葢亦傳習之誤昻當作降大槩龍虎俱以馴頫俯伏為吉𤣥武不垂者拒屍主山高昂頭不垂伏如不肻受人之葬而拒之也朱雀不舞者騰去前山反背無情上正下斜順水擺竄不肻盤旋朝穴若欲飛騰而去也夫以支為龍虎者來止跡乎岡阜要如肘臂謂之環抱此言平洋大地左右無山以為龍虎止有高田勾夾故當求岡阜之來蹤土跡于隱隱隆隆之中最要寛展如人之肘臂腕肉有情明堂缺夷自為局垣一龍一虎如規之圓言其形如步武旋轉自然團簇環抱而恬軟也以水為朱雀者衰旺係乎形應忌乎湍激謂之悲泣水在明堂以其位乎前故亦名朱雀若池湖淵潭則以澄清瑩淨為可喜江河溪澗則以屈曲之𤣥為有情倘亷刼箭割湍激悲泣則為㐫矣由是觀之雖水之取用不同闗繫乎形勢之美惡則一也葢有是形則有是應故子孫之衰旺亦隨之相感之理也别有一般鼕鼕閧閧如擂鼓聲者得之反吉又非湍激悲泣之比朱雀源於生氣氣為水母有氣斯有水原其所始水之流行實生氣之所為也生氣升而為雲降而為雨山川妙用流行變化勢若循環無有窮已是故山之與水當相體用不可須㬰離也派於未盛朝于大旺派者水之分也朝者水之合也夫水之行初分懸溜始于一線之微此水之未盛也小流合大流乃漸逺而漸多而至于㑹流總瀦者此水之大旺也葢水之㑹由山之止山之始乃水之起能知水之大會則知山之大盡推其所始究其所終離其所分合其所聚置之心目之間胸臆之内總而思之則大小無從而逃地理可貫而盡矣若夫禹貢之載九州其大要則係于隨山濬川之四字如導沇水導河導漾之類皆水之未盛也如入于江入于河入于海者皆水之大旺也以其大勢言之則山川之起于西北自一而生萬也水之聚于東南合萬而歸一也禹貢舉天下之大者而言之則始于近而終于逺自一里而至十里由十里而至于足跡之所能及推其山之起止究其水之分合是成小禹貢也澤其相衰流于囚謝澤謂陂澤詩彼澤之陂註云水所鍾聚也水既瀦蓄淵停則止水勢已煞故曰衰流于囚謝者水盈科而進則其停者已乆溢為餘波故曰謝以返不絶山之氣運隨水而行凡遇吉凶形勢若逺若近無不隨感而應然水之行也不欲斜飛直攛反背無情要得衆砂節節欄截之𤣥屈曲有情而成不絶之運化也法每一折瀦而後洩此言水之去勢每于屈折處要有瀦蓄然亦不必盡泥穴前但得一水則亦可謂之瀦矣善于作用者穴前元辰直長法以穴中溝頭水論瀦洩每折中作斗既瀦而後洩去可救初年無患此亦是奪神功之妙也洋洋悠悠顧我欲留此言水之去勢悠洋眷戀有不忍遽去之情顧我而欲留也其來無源其去無流源深流長不知其來砂攔局宻不見其去經曰山來水回貴夀而財山來者衆山攢集水回者羣流環㑹此富貴夀考之穴也山囚水流虜王滅侯山囚明堂逼塞不寛舒也水流元辰直溜不縈紆也生旺係乎形應地理之法不過山水向背為𦂳向則為吉背則為凶故向坐有法當取之于應照水路有法當求之于曲折他無與焉雜篇占山之法以勢為難而形次之方又次之千尺為勢百尺為形勢言濶逺形言淺近然有大山大勢大地大形則當大作規模高擡望眼而後可以求之也勢有隱顯或去山勢從東趨形從西結勢由左來穴自右出勢又有佯詐穴亦有花假此所以為最難也其次莫如形有一二里為一形此形之大者也有只就局内結為蜂蝶蛙蛤之類此形之小者也鵞鳯相肖獅虎相類形若不眞穴何由擬故形亦為難也又其次莫如方方者方位之説謂某山來合坐作某方向之類是也勢如萬馬自天而下其葬王者此下言眞龍降勢之大畧可總括天下山嵐之行度若欲逐一分類則反包括不盡矣其葬王者言其貴也不得拘之勢如巨浪重嶺叠嶂千乗之葬峯巒層踏如洪波巨浪奔湧而來當出千乗之貴勢如降龍水遶雲從爵祿三公星嵐撑漢踏銜而下如龍之降也及至歇處山如雲擁水似帶蟠烏得不貴勢如重屋茂草喬木開府建國眞龍降勢層層踏踏如人家之重屋叠架所以為貴也勢如驚蛇屈曲徐斜㓕亡家國横竄直播行度畏縮而不條暢死硬而不委蛇故葬者家亡國㓕勢如矛戈兵死形囚尖利如矛葉直硬如鎗杆故子孫多死于㐫横非命勢如流水生人皆鬼順瀉直流去無禁止之情此遊漫之龍也葬之者主少亡客死形如負扆有壠中峙法葬其止王侯崛起凡結穴之處負隂抱陽前親後倚此總相立穴之大情也負扆形如御屏壁立﨑急不可扦穴法當立于平地須龍貴朝眞而後可不謂負扆便能如是之貴也形如燕窠法葬其曲胙土分茅燕窠多于山腰龍虎包裹自成形局入穴不見孤露所以為貴形如側壘後岡逺來前應曲回九棘三槐穴形偃詐如壘之側𤣥武來上前朝後應委曲周回法當就壘口扦之主三公九卿之貴形如覆釡其嶺可富覆釡如五星中所謂覆釡金也唯挨金下水穴今言形如覆釡則合葬麓隂龍而陽穴也若葬于巓乃是以隂挨隂不㡬于獨隂不成之義乎近來世俗正坐此病無不葬壠于巓也固有照天蠟燭及貫頂法多葬山嶺亦須有天然成穴方可下形如植冠永昌且歡植冠言其形穴之尊嚴也後仰前倚壁立﨑急宜阡緩中形如投筭百事昏亂山形如筭横直亂投故凶形如亂衣妬女淫妻山形剝落破碎如亂衣之不整故淫亂形如灰囊災舍焚倉大抵即内篇水泉砂礫之意言生氣不蓄之穴得雨暫濕雨止即乾如湯之淋灰故㓙形如覆舟女病男囚横岡無脉中央四隤無穴可扦葬之則男女不利形如横几子絶孫死𤣥武縮頭入首無脉穴何可扦然有得几之正形者乃水之所變故出文章科第世有盧相公祖楊神童祖方太監祖皆葬几形葢未可以其㓙而棄之也形如臥劒誅夷偪僭形狹而長首脱而瘠純石剝落文理枯燥故㓙然有劒形而出貴者如石使相祖曾文遄下托手穴是也形如仰刀㓙禍伏逃形如魚之鬐鬛無肥厚氣象故㓙牛臥馬馳鸞舞鳯飛此言各得其本性而應形眞螣蛇委蛇委蛇則為活蛇故吉直硬為死則㓙黿鼉魚鱉以水别之四者皆水族故以近水而應形眞牛富鳯貴牛出于土星故富鳯出于木星故貴螣蛇凶危蛇心險有毒故多凶遇蛙蛤則貪惏而為小人葢蛇之所陷也逢蜈蚣金龜鳩鳥則畏謹而為君子乃欲陷于蛇也古今阡蛇形地者何限豈可例以凶危而不用乎形類百動葬者非宜四應前桉法同忌之形勢止伏如屍居之不動方可扦穴若有不定豈可用乎非惟主山但目前所見飛定擺竄于我無情者悉當忌之夫勢與形順者吉勢與形逆者凶勢吉形凶百缺一勢凶形吉禍不旋日形勢二者皆以止伏為順飛走擺竄為逆順則吉逆則凶勢吉形凶尤可希一日之福若勢凶形吉則禍不待終日極言應之速也經曰地有四勢氣從八方寅申己亥四勢也震離坎兌乾坤艮巽八方也若但言地有四勢只有朱雀𤣥武青龍白虎而已氣從八方只有四正四隅而已兩句下證之以寅申巳亥震離坎兌乾坤艮巽之説則當以方位解之四勢為四長生如火生寅水生申金木生于己亥是也八方為八卦東方震艮南巽離西方坤兌北乾坎是也又有所謂六秀六貴分金三十吉龍併十六貴龍等説皆原于此是星卦之所由興也是故四勢之山生八方之龍四勢行龍八方施生一得其宅吉慶榮貴四勢者陳石璧所謂五行生氣之地八方八卦方也八龍不能自生要得寅申己亥五行之生氣而後能施生也其大意言八方之龍要從長生位上得來則吉假如震龍屬木長生于亥要必自亥位發始即為生氣之地或從亥上經過亦是餘可類推但此之生氣與内外篇之言生氣不同土圭測其方位玉尺度其逺邇土圭所以辨方正位其制見于周禮玉尺所以度量逺邇其數生于黄鍾今臺司度日影以定候多用此制也夫葬乾者勢欲起伏而長形欲濶厚而方葬坤者勢欲連辰而不傾形欲廣厚而長平葬艮者勢欲委蛇而順形欲高峙而峻葬巽者勢欲峻而秀形欲銳而雄葬震者勢欲緩而起形欲聳而峩葬離者勢欲馳而窮形欲起而崇葬兌者勢欲天來而坡垂形欲方廣而平夷葬坎者勢欲曲折而長形欲秀直而昻此言八卦之山必欲合如是之形勢然後為吉夫天下山川行度千變萬化豈有一定之理哉何者不欲起伏而長濶厚而方寧獨乾之一山如是哉此只言其大槩耳是以形勢為上而方位次之必欲如此又何異於刻舟求劒者乎缺存之以俟㕘考葢穴有三吉葬直六凶天光下臨地徳上載天光地徳前見藏神合朔神迎鬼避一吉也神吉神鬼凶煞朔謂歲月日時言藏神合乎吉朔也神迎鬼避得吉年月也隂陽冲合五土四備二吉也目力之巧工力之具趨全避缺増高益下三吉也解見前隂陽差錯為一凶歲時之乖為二凶此言葬日不得方向年月之通利力小圖大為三凶生人福力淺薄而欲圖王侯之地是不量力度徳也然此亦不可泥憑福恃勢為四凶憑見在之福恃當今之勢富貴之家自謂常如今日而不深慮有父母之喪者不思盡力以求宜隱之地但茍焉窀變而已正程子之所謂唯欲掩其目之不見反以隂陽之理為無足缺可勝道哉魏志管輅遇征東將軍母丘儉之墓嘆曰松栢雖茂無形可文碑諡雖美無後可守𤣥武垂頭青龍無足白虎銜屍朱雀悲泣四危已備去當滅族後果如其言又左氏春秋傳㑹文公十三年邾文公卜遷于繹史曰利于民不利于君公曰茍利于民孤之利也左右曰命可長也君何弗為公曰命在養民民茍利矣遷也吉莫如之遂遷五月公果卒然固有數焉而隂陽之理亦有所定矣僣上偪下為五凶僣上言庶人墳墓不得如大官制度貧家行喪不得效富室眩耀及不得作無益華靡亡者無益存者招禍偪下為儉不中禮慳吝鄙澁父母墳墓不肯即時盡作用之法因循茍且致生凶變作用者謂如作明堂通水道及夫截龎去滯増高益下陣水蔽風之類皆是也變應怪見為六凶上言天時人事不能全美或有吉地吉穴主人濡滯不葬或是非爭競而害成或貧病兼憂而不能舉或明師老死不復再來或停喪久逺而兵火不測或子孫叅差而人事不齊或官事牢獄而不復可為或日怠日㤀竟成棄置或全家絶㓕同歸暴露是皆因葬不即舉而變見多端也嗚呼為人者可不凛凛然而知戒謹乎哉經曰穴吉葬凶與棄屍同言形勢雖吉而葬不得穴或葬已得穴而不知深淺之度皆與委而棄之者何以異哉錦囊一書其大槩專以生氣為主即太極為之體也其次分為枝壠即隂陽為之用也又其次曰風水曰止聚曰形勢曰骨脈又其次則驗文理之秀異明作用之利宜學者當熟讀玩味則知景純之心法矣葬書
