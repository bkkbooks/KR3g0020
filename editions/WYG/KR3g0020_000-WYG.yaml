  text: 欽定四庫全書子部七
  hash: sha256:c56cb4cd5b732cd36ea971ae80108660cfb3e98cda8d401783cc8f10d44be81a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3g0020_WYG_000-1a, image: WYG0808/WYG0808-0011a.png}
body:
  text: 葬書術數類三相宅相墓之屬提要臣等謹案葬書一卷舊本題晉郭璞撰璞有爾雅註已著録葬地之説莫知其所自來周官冡人墓大夫之職稱皆以族葬是三代以上葬不擇地之明證漢書藝文志形法家以宮宅地形與相人相物之書並列則其數自漢始明然尚未專言葬法也後漢書袁安傳載安父沒訪求葬地道逢三書生指一處當世為上公安從之故累世貴盛是其術盛傳於東漢以後其特以是擅名者則璞為最著考璞本傳載璞從河東郭公受青囊中書九卷遂洞天文五行卜筮之術璞門人趙載嘗竊青囊書為火所焚不言其嘗著葬書唐末有葬書地脈經一卷葬書五隂一卷又不言為璞所作惟宋志載有璞葬書一卷是其書自宋始出其後方技之家競相粉飾遂有二十篇之多蔡元定病其蕪雜為刪去十二篇存其八篇吳澄又病蔡氏未盡藴奥擇至純者為内篇精麤純駁相半者為外篇麤駁當去而姑存者為雜篇新喻劉則章親受之吳氏為之註釋今此本所分内篇外篇雜篇盖猶吳氏之舊本至注之出於劉氏與否則不可考矣宋志本名葬書後來術家尊其説者改名葬經毛晉汲古閣刻本亦承其譌殊為失考今仍題舊名以從其朔焉乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:c31bb4192453ee487ddf82846761d40e1f6c1e045776f6f8ee48b658e9012d7e
